<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointage Chantier RJH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f3f5f4; --panel:#ffffff; --panel-2:#f6f8f7;
    --ink:#17242b; --muted:#5f6b64;
    --line:#dbdfdc; --line-strong:#b7bdb8;
    --accent:#2f7d64; --accent-hover:#26654f; --accent-ink:#ffffff;
    --accent-2:#16324f;
    --green:#1f9d55; --green-bg:#e6f5ec; --green-ink:#0f6a37;
    --orange:#d97706; --orange-bg:#fdf0e0; --orange-ink:#8a5200;
    --red:#dc2626; --red-bg:#fbe9e9; --red-ink:#a71d1d;
    --focus:#2f7d64;
    --radius:9px;
    --shadow:0 6px 24px rgba(20,32,26,.08);
    --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-head:"Archivo","Inter",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1518; --panel:#161f23; --panel-2:#1b262b;
    --ink:#e7ede9; --muted:#93a09a;
    --line:#293439; --line-strong:#3a474e;
    --accent:#4dbd9d; --accent-hover:#66ccae; --accent-ink:#04241c;
    --accent-2:#bcd4e6;
    --green:#3bbd73; --green-bg:#15301f; --green-ink:#8fdcac;
    --orange:#e0993f; --orange-bg:#372611; --orange-ink:#f0bd7e;
    --red:#e5706f; --red-bg:#371c1c; --red-ink:#f0a6a6;
    --focus:#4dbd9d;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1518; --panel:#161f23; --panel-2:#1b262b;
    --ink:#e7ede9; --muted:#93a09a;
    --line:#293439; --line-strong:#3a474e;
    --accent:#4dbd9d; --accent-hover:#66ccae; --accent-ink:#04241c;
    --accent-2:#bcd4e6;
    --green:#3bbd73; --green-bg:#15301f; --green-ink:#8fdcac;
    --orange:#e0993f; --orange-bg:#372611; --orange-ink:#f0bd7e;
    --red:#e5706f; --red-bg:#371c1c; --red-ink:#f0a6a6;
    --focus:#4dbd9d;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:15px; line-height:1.45;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:var(--font-head);margin:0 0 .4em;font-weight:650;letter-spacing:-.005em;text-wrap:balance}
  h1{font-size:20px} h2{font-size:16px} h3{font-size:14px;text-transform:none}
  a{color:var(--accent);text-decoration:none;cursor:pointer}
  button{font-family:inherit;font-size:15px;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .btn{
    border:1px solid var(--line-strong); background:var(--panel); color:var(--ink);
    padding:10px 15px; border-radius:var(--radius); font-weight:550;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; min-height:42px;
  }
  .btn:hover{background:var(--panel-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--panel-2)}
  .btn.sm{padding:7px 11px;font-size:14px;min-height:36px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px 16px;padding:10px 16px;
    position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .brand img{height:28px;width:auto;display:block}
  .brand .sep{width:1px;height:20px;background:var(--line)}
  .brand .name{font-family:var(--font-head);font-size:13.5px;letter-spacing:.02em;color:var(--accent-2);text-transform:uppercase}
  .nav{display:flex;gap:4px;flex-wrap:wrap;order:3;width:100%}
  .nav a{padding:8px 11px;border-radius:6px;color:var(--muted);font-weight:550;font-size:14px}
  .nav a.active{background:var(--green-bg);color:var(--accent)}
  .nav a:hover{background:var(--panel-2)}
  .spacer{flex:1}
  .who{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
  .who .avatar{width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--muted);display:grid;place-items:center;font-weight:650;font-size:12px}
  .main{padding:18px 16px 44px;max-width:1180px;margin:0 auto;width:100%}
  .rolepill{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
    padding:3px 7px;border-radius:999px;background:var(--green-bg);color:var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card + .card{margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .weeknav{display:flex;align-items:center;gap:6px}
  .weeknav .wk{font-family:var(--font-head);font-weight:600;text-align:center;font-size:14px}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:650;border:1px solid transparent}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip.green{background:var(--green-bg);color:var(--green-ink);border-color:var(--green)}
  .chip.green .dot{background:var(--green)}
  .chip.orange{background:var(--orange-bg);color:var(--orange-ink);border-color:var(--orange)}
  .chip.orange .dot{background:var(--orange)}
  .chip.red{background:var(--red-bg);color:var(--red-ink);border-color:var(--red)}
  .chip.red .dot{background:var(--red)}
  .chip.grey{background:var(--panel-2);color:var(--muted);border-color:var(--line-strong)}
  .chip.grey .dot{background:var(--muted)}

  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-strong);border-radius:var(--radius)}
  table.ts{border-collapse:separate;border-spacing:0;width:100%;min-width:920px;background:var(--panel);
    font-variant-numeric:tabular-nums}
  table.ts th,table.ts td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
  table.ts th:last-child,table.ts td:last-child{border-right:0}
  table.ts thead th{
    background:var(--panel-2);font-family:var(--font-head);font-weight:600;font-size:11.5px;padding:9px 6px;
    text-transform:uppercase;letter-spacing:.03em;color:var(--muted);position:sticky;top:0;z-index:3;
  }
  table.ts tbody td{height:52px}
  table.ts .txt{text-align:left}
  table.ts select,table.ts input{
    width:100%;height:50px;border:0;background:transparent;font-family:inherit;font-size:16px;
    text-align:center;color:var(--ink);outline:none;padding:0 6px;-webkit-appearance:none;appearance:none;border-radius:0;
  }
  table.ts select option{color:#000}
  table.ts .txt select{text-align:left;padding-left:8px}
  table.ts td.day input{font-weight:600}
  table.ts td.day input:focus,table.ts .txt select:focus{background:var(--green-bg);box-shadow:inset 0 0 0 2px var(--accent)}
  table.ts td.imp{background:var(--panel-2);font-weight:600;color:var(--muted);font-size:13px}
  table.ts td.sub{background:var(--panel-2);font-weight:700}
  table.ts .col-sticky{position:sticky;left:0;z-index:2;background:var(--panel);border-right:1px solid var(--line-strong)}
  table.ts thead .col-sticky{z-index:4;background:var(--panel-2)}
  table.ts tfoot td{background:var(--panel-2);font-weight:750;height:46px;font-size:13px;position:sticky;bottom:0}
  table.ts tfoot .col-sticky{background:var(--panel-2)}
  table.ts tr.err td.day input{background:var(--red-bg)}
  .daycol{width:70px}
  .obscol{min-width:170px}
  table.ts td.obs input{text-align:left;padding-left:8px;font-size:14px;color:var(--muted)}
  table.ts td.obs input:focus{color:var(--ink);background:var(--green-bg);box-shadow:inset 0 0 0 2px var(--accent)}
  .del{color:var(--muted);background:transparent;border:0;font-size:18px;padding:10px;line-height:1}
  .del:hover{color:var(--red)}

  .totbar{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;align-items:flex-end}
  .totbar .big{font-family:var(--font-head);font-size:22px;font-weight:700}
  .totbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

  .alert{border-radius:var(--radius);padding:11px 13px;font-size:13px;font-weight:550;margin-top:12px;display:flex;gap:9px;align-items:flex-start}
  .alert.warn{background:var(--orange-bg);color:var(--orange-ink);border:1px solid var(--orange)}
  .alert.bad{background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red)}
  .alert.ok{background:var(--green-bg);color:var(--green-ink);border:1px solid var(--green)}

  table.grid{border-collapse:collapse;width:100%;background:var(--panel);font-variant-numeric:tabular-nums}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;font-size:14px}
  table.grid thead th{background:var(--panel-2);font-family:var(--font-head);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  table.grid tbody tr:hover{background:var(--panel-2)}
  table.grid td.num{text-align:right}
  .grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:6px 0 4px}
  .kpi{border:1px solid var(--line);border-radius:var(--radius);padding:13px;background:var(--panel)}
  .kpi .n{font-family:var(--font-head);font-size:22px;font-weight:700}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  .login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;
    background:radial-gradient(120% 60% at 50% 0%, var(--green-bg), var(--bg) 70%);padding:22px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;
    width:100%;max-width:372px;box-shadow:var(--shadow)}
  .login-card .logo-box{text-align:center;margin-bottom:4px}
  .login-card .logo-box img{height:44px;width:auto}
  .login-card h1{text-align:center;font-size:18px;margin-top:12px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--muted)}
  .field input{width:100%;padding:12px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font-family:inherit;font-size:16px;background:var(--panel);color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--green-bg)}
  .login-hint{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;line-height:1.7}
  .login-hint b{color:var(--ink)}

  .overlay{position:fixed;inset:0;background:rgba(10,16,13,.5);display:grid;place-items:center;z-index:50;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:500px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}

  textarea,select.inp,input.inp{width:100%;padding:11px;border:1px solid var(--line-strong);border-radius:var(--radius);
    font-family:inherit;font-size:16px;background:var(--panel);color:var(--ink)}
  textarea:focus,select.inp:focus,input.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--green-bg)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:12px}
  .pill-list{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent-2);color:#fff;
    padding:11px 18px;border-radius:999px;font-weight:600;z-index:99;box-shadow:var(--shadow);max-width:90vw;text-align:center}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (min-width:780px){
    .nav{order:0;width:auto}
    h1{font-size:22px}
    .weeknav .wk{min-width:250px;font-size:15px}
  }
  @media (max-width:480px){
    .who .txt{display:none}
    .brand .name{display:none}
  }
</style>
</head>
<body>
<div id="root"></div>
<style>
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }
  table.ts td.need { background: var(--orange-bg); }
  table.ts td.need select, table.ts td.need input { box-shadow: inset 0 0 0 1.5px var(--orange); }
  table.ts td.need select:focus, table.ts td.need input:focus { box-shadow: inset 0 0 0 2px var(--accent); }

  .poster { background:#ffffff; color:#16324f; border:1px solid var(--line); border-radius:14px;
    max-width:540px; margin:0 auto; padding:38px 30px; text-align:center; }
  .poster-logo { height:56px; width:auto; margin-bottom:20px; }
  .poster-title { font-family:var(--font-head,"Archivo",sans-serif); font-size:32px; font-weight:700; letter-spacing:-.01em; color:#16324f; }
  .poster-sub { font-size:17px; color:#5f6b64; margin:6px 0 24px; }
  .poster-qr { display:flex; justify-content:center; }
  .poster-qr canvas, .poster-qr img { display:block; width:300px; height:300px; image-rendering:pixelated; }
  .poster-url { margin-top:20px; font-size:15px; font-weight:700; word-break:break-all; color:#2f7d64; }
  .poster-note { margin-top:16px; font-size:12.5px; color:#5f6b64; line-height:1.7; }

  .nav-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-left:5px; vertical-align:middle; }

  @media print {
    :root { color-scheme: light; }
    body { background:#fff !important; }
    .topbar, .nav, .who, .spacer, .no-print { display:none !important; }
    .main { padding:0 !important; max-width:none !important; }
    .poster { border:0; box-shadow:none; max-width:none; margin-top:30px; }
    .poster-qr img { width:360px; height:360px; }
  }
</style>

const dayTot = (ls, i) => ls.reduce((a, l) => { const v = l[DCOL[i]]; return a + (typeof v === "number" ? v : num(v)); }, 0);
const total = (ls) => ls.reduce((a, l) => a + rowSub(l), 0);

function frDateTime(iso) { try { const d = new Date(iso); return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " à " + ("0" + d.getHours()).slice(-2) + "h" + ("0" + d.getMinutes()).slice(-2); } catch (e) { return ""; } }

/* ---------- line validation ---------- */
function lineErrors(l) {
  const errs = [];
  const act = l.batiment_id || l.niveau_id || l.salle_id || l.typologie_id;
  let hasH = false;
  DCOL.forEach((k, i) => {
    const v = l[k];
    if (v === "bad") errs.push(`Valeur incorrecte (${DAYS[i]})`);
    else { const n = typeof v === "number" ? v : num(v); if (n !== 0) hasH = true; if (n < 0) errs.push(`Heures négatives (${DAYS[i]})`); else if (n > (S.ref.parametres.seuil_heures_jour || 16)) errs.push(`Total journalier anormal (${DAYS[i]})`); }
  });
  if (hasH && !act) errs.push("Ligne sans activité renseignée");
  if (act && !hasH) errs.push("Activité sans heures saisies");
  if (act && !(l.batiment_id && l.niveau_id && l.salle_id && l.typologie_id)) errs.push("Données incomplètes");
  return errs;
}

async function boot() {
  if (_booting || S.profile) return;

  try {

    const { data: prof, error } = await sb.from("app_users").select("*").eq("auth_id", u.user.id).maybeSingle();

function today() { const d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function semaineCourante() {
  if (!S.semaines.length) return null;
  const t = today();
  const d = (x) => String(x).slice(0, 10);
  return S.semaines.find((s) => d(s.date_debut) <= t && t <= d(s.date_fin))   // semaine en cours (lun→ven)
    || S.semaines.find((s) => d(s.date_debut) <= t)                            // sinon la plus récente déjà commencée (week-end)

}

function newLigne() {

    h_lundi: 0, h_mardi: 0, h_mercredi: 0, h_jeudi: 0, h_vendredi: 0, observation: "", ordre: S.lignes.length };

function readTable() {
  document.querySelectorAll("tr[data-idx]").forEach((tr) => {
    const l = S.lignes[+tr.dataset.idx]; if (!l) return;
    tr.querySelectorAll("select[data-f]").forEach((sel) => { l[sel.dataset.f] = sel.value || null; });

async function ensureSheet() {

    .insert({ app_user_id: S.focusUser, semaine_id: S.semaine.id, statut: "brouillon" }).select().single();
  if (error) throw error;
  S.sheet = data; return data;
}
function ligneVide(l) {
  return !l.batiment_id && !l.niveau_id && !l.salle_id && !l.typologie_id &&
    !((l.observation || "").trim()) &&
    DCOL.every((k) => !(typeof l[k] === "number" ? l[k] : num(l[k])));
}
async function saveSheet(silent) {
  readTable();
  S.lignes = S.lignes.filter((l) => l.id || !ligneVide(l));   // ne pas enregistrer les lignes neuves entièrement vides
  S.busy = true; render();
  try {
    if (!S.lignes.length && !S.sheet) { S.busy = false; render(); if (!silent) toast("Rien à enregistrer."); return; }
    await ensureSheet();
    if (S.deleted.length) { const { error } = await sb.from("lignes").delete().in("id", S.deleted); if (error) throw error; S.deleted = []; }
    for (let i = 0; i < S.lignes.length; i++) {
      const l = S.lignes[i];
      const payload = {
        feuille_id: S.sheet.id, batiment_id: l.batiment_id, niveau_id: l.niveau_id, salle_id: l.salle_id,
        typologie_id: l.typologie_id, observation: l.observation || null, ordre: i,
      };
      DCOL.forEach((k) => payload[k] = (typeof l[k] === "number" ? l[k] : num(l[k])) || 0);
      if (l.id) { const { error } = await sb.from("lignes").update(payload).eq("id", l.id); if (error) throw error; }
      else { const { data, error } = await sb.from("lignes").insert(payload).select().single(); if (error) throw error; S.lignes[i] = data; }
    }
    if (isStaff() && S.focusUser && S.focusUser !== S.profile.id) {
      await sb.from("journal").insert({ feuille_id: S.sheet.id, action: "correction", auteur_id: S.profile.id }).then(() => {}, () => {});
    }
    await loadSheetFor(S.focusUser);
    if (!silent) toast("Pointage enregistré.");
  } catch (e) { alert("Enregistrement impossible : " + errMsg(e)); }
  S.busy = false; render();
}

  ]);

    const f = byUser[u.id];

    return { u, statut: st, total: f ? total(f.lignes || []) : 0 };
  });
  // tendance : les 12 dernières semaines QUI ONT des pointages (ordre chronologique)
  const { data: fRows } = await sb.from("feuilles").select("semaine_id");
  const idsData = [...new Set((fRows || []).map((f) => f.semaine_id))];

    (fs || []).forEach((f) => byS[f.semaine_id] = (byS[f.semaine_id] || 0) + total(f.lignes || []));
  }
  S.dashTrend = sems.slice().reverse().map((s) => ({
    numero: s.numero, annee: s.annee, total: byS[s.id] || 0, current: S.semaine && s.id === S.semaine.id,
  }));

async function loadBackupState() {
  // Le badge se déclenche uniquement quand une SEMAINE COMPLÈTE a été validée
  // (bouton « Valider la semaine ») et qu'aucune sauvegarde n'a été faite depuis.
  try {
    const [{ data: lastSv }, { data: evts }] = await Promise.all([
      sb.from("sauvegardes").select("created_at").order("created_at", { ascending: false }).limit(1).maybeSingle(),
      sb.from("journal").select("action, details, created_at")
        .in("action", ["validation_semaine", "deverrouillage_semaine"])
        .order("created_at", { ascending: false }).limit(20),
    ]);
    const last = lastSv ? lastSv.created_at : null;
    // dernière validation de semaine encore "en vigueur" (pas suivie d'un déverrouillage de la même semaine)
    let val = null;
    const deverrou = new Set();
    for (const e of (evts || [])) {
      const num = e.details && e.details.semaine;
      if (e.action === "deverrouillage_semaine") { if (num != null) deverrou.add(num); continue; }
      if (e.action === "validation_semaine" && !deverrou.has(num)) { val = { num, at: e.created_at }; break; }
    }
    S.backup = {
      last,
      due: !!val && (!last || last < val.at),
      semaine: val ? "S" + val.num : "",
      valDate: val ? val.at : null,
    };
  } catch (e) { S.backup = { last: null, due: false, semaine: "" }; }
}

async function fetchDetail() {
  const { data: feuilles, error } = await sb.from("feuilles")
    .select("app_user_id, statut, lignes(*)").eq("semaine_id", S.semaine.id);
  if (error) { alert("Export impossible : " + errMsg(error)); return []; }
  const uids = [...new Set((feuilles || []).map((f) => f.app_user_id))];
  let umap = {};
  if (uids.length) {
    const { data: us } = await sb.from("app_users").select("id, prenom, nom, email").in("id", uids);
    (us || []).forEach((u) => umap[u.id] = u);
  }
  const rows = [];
  (feuilles || []).forEach((f) => {
    const u = umap[f.app_user_id] || { prenom: "?", nom: "?", email: "" };
    (f.lignes || []).forEach((l) => {
      const b = (S.ref.batiments.find((x) => x.id === l.batiment_id) || {}).code || "";
      const nv = (S.ref.niveaux.find((x) => x.id === l.niveau_id) || {}).code || "";
      const sl = (S.ref.salles.find((x) => x.id === l.salle_id) || {}).code || "";
      const tv = (S.ref.typologies.find((x) => x.id === l.typologie_id) || {}).libelle || "";
      DCOL.forEach((k, i) => {
        const h = typeof l[k] === "number" ? l[k] : num(l[k]);
        if (h) rows.push({
          Collaborateur: fullName(u), "E-mail": u.email, Semaine: "S" + S.semaine.numero,
          Date: dateOfDay(i), Jour: DAYS[i], "Bâtiment": b, Niveau: nv, Salle: sl,
          Travaux: tv, Imputation: l.imputation || "", Heures: h, Observation: l.observation || "",

    });

      date: x.created_at,

      collab: um[x.app_user_id] ? fullName(um[x.app_user_id]) : "—",
      libelle: x.libelle || "—",
      detail: x.op === "insert" ? "Ligne ajoutée" : x.op === "delete" ? "Ligne supprimée"
        : (x.changes || []).map((c) => c.champ + " : " + fv(c.avant) + " → " + fv(c.apres)).join(" · "),
      auteur: um[x.auteur_id] ? fullName(um[x.auteur_id]) : "—",
    }));
  } else {
    const { data: j } = await sb.from("journal").select("*").order("created_at", { ascending: false }).limit(200);
    const fids = [...new Set((j || []).map((r) => r.feuille_id).filter(Boolean))];
    const aids = [...new Set((j || []).map((r) => r.auteur_id).filter(Boolean))];
    let fmap = {}, umap = {}, smap = {};
    if (fids.length) {
      const { data: fs } = await sb.from("feuilles").select("id, app_user_id, semaine_id").in("id", fids);
      (fs || []).forEach((f) => fmap[f.id] = f);
      const uids = [...new Set((fs || []).map((f) => f.app_user_id))].concat(aids);
      const sids = [...new Set((fs || []).map((f) => f.semaine_id))];
      const [{ data: us }, { data: ss }] = await Promise.all([
        sb.from("app_users").select("id,prenom,nom").in("id", [...new Set(uids)]),
        sids.length ? sb.from("semaines").select("id,numero").in("id", sids) : Promise.resolve({ data: [] }),
      ]);
      (us || []).forEach((u) => umap[u.id] = u);
      (ss || []).forEach((s) => smap[s.id] = s);
    } else if (aids.length) {
      const { data: us } = await sb.from("app_users").select("id,prenom,nom").in("id", aids);
      (us || []).forEach((u) => umap[u.id] = u);
    }
    S.hist.journal = (j || []).map((r) => {
      const f = fmap[r.feuille_id];
      return {
        date: r.created_at, action: ACTION_LABEL[r.action] || r.action, motif: r.motif,
        collab: f && umap[f.app_user_id] ? fullName(umap[f.app_user_id]) : (r.details && r.details.semaine ? "Semaine " + r.details.semaine : "—"),
        semaine: f && smap[f.semaine_id] ? "S" + smap[f.semaine_id].numero : (r.details && r.details.semaine ? "S" + r.details.semaine : ""),
        auteur: umap[r.auteur_id] ? fullName(umap[r.auteur_id]) : "—",
      };
    });
  }
}

function afficheUrl() { return location.origin + location.pathname.replace(/[^/]*$/, ""); }
function renderQR(url) {
  const box = document.getElementById("qr-box");
  if (!box || typeof QRCode === "undefined") return;
  box.innerHTML = "";
  try { new QRCode(box, { text: url, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { return; }
  setTimeout(() => {
    const el = box.querySelector("canvas") || box.querySelector("img");
    const dl = document.getElementById("qr-dl");
    if (!el || !dl) return;
    try { dl.href = el.tagName === "CANVAS" ? el.toDataURL("image/png") : el.src; } catch (e) {}
  }, 200);
}

window.setAuth = (m) => { S.authMode = m; S.authNotice = null; render(); };
function bindAuth() { const p = $("#a-pass"); if (p) p.addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth(); }); }
function authErr(t) { const el = $("#a-msg"); el.textContent = t; el.style.display = "block"; }
window.doAuth = async () => {
  const email = ($("#a-email").value || "").trim().toLowerCase();
  const pass = $("#a-pass") ? $("#a-pass").value : "";
  if (!email) return authErr("Renseigne ton adresse e-mail.");
  S.busy = true; render();
  try {
    if (S.authMode === "reset") {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
      if (error) throw error;
      S.busy = false; S.authMode = "login"; render(); toast("Si un compte existe, un e-mail vient d'être envoyé.");
      return;
    }
    if (pass.length < (S.authMode === "signup" ? 8 : 1)) { S.busy = false; render(); return authErr("Mot de passe trop court (8 caractères minimum)."); }
    if (S.authMode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw error;
      if (!data.session) { S.busy = false; S.authMode = "login"; S.authNotice = "Accès créé. Connectez-vous avec votre mot de passe."; render(); return; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
    }
    S.busy = false;
    await boot();
    return;
  } catch (e) {
    S.busy = false; render();
    const msg = errMsg(e);
    if (S.authMode === "signup" && /Database error saving new user|not.*validé|administrateur/i.test(msg))
      authErr("Cette adresse n'a pas encore été validée par l'administrateur — ou un accès existe déjà (dans ce cas, utilise « Connexion »).");
    else if (/already registered|already been registered/i.test(msg)) authErr("Un accès existe déjà pour cette adresse. Utilise « Connexion » ou « Mot de passe oublié ».");
    else if (/Invalid login/i.test(msg)) authErr("E-mail ou mot de passe incorrect.");
    else authErr(msg);
  }
};

window.doRecovery = async () => {

function niveauxFor(bat) { return S.ref.niveaux.filter((n) => !n.batiment_id || n.batiment_id === bat); }
function sallesFor(bat, niv) { return S.ref.salles.filter((s) => (!s.batiment_id || s.batiment_id === bat) && (!s.niveau_id || s.niveau_id === niv)); }
function opt(list, val, ph, key) { return '<option value="">' + ph + '</option>' + list.map((o) => '<option value="' + o.id + '"' + (o.id === val ? " selected" : "") + '>' + esc(o[key] || o.code || o.libelle) + '</option>').join(""); }

function viewSheet(userId, asStaff) {
  const u = asStaff ? (S.dash && (S.dash.find((d) => d.u.id === userId) || {}).u) || S.focusUserObj : S.profile;
  const uname = u ? fullName(u).toUpperCase() : "";
  const st = (!S.sheet || !S.lignes.length) ? "manquant" : S.sheet.statut;
  const meta = STATE_META[st];
  const transmis = st === "a_controler";
  const collabLocked = !asStaff && (st === "a_controler" || st === "valide" || st === "verrouille");
  const staffLocked = asStaff && st === "verrouille" && !isAdmin();
  const locked = collabLocked;
  const editable = !collabLocked && !staffLocked;
  const INCOMPLET_MSGS = ["Ligne sans activité renseignée", "Activité sans heures saisies", "Données incomplètes"];
  const allErrs = S.lignes.flatMap(lineErrors).filter((e) => !INCOMPLET_MSGS.includes(e));
  const hardErrs = allErrs.length;

  const lineStarted = (l) => (DCOL.some((k) => { const v = l[k]; return (typeof v === "number" ? v : num(v)) !== 0; })) || l.batiment_id || l.niveau_id || l.salle_id || l.typologie_id;
  const lineComplete = (l) => l.batiment_id && l.niveau_id && l.salle_id && l.typologie_id && DCOL.some((k) => { const v = l[k]; return (typeof v === "number" ? v : num(v)) !== 0; });
  const lineNeeds = (l) => editable && (l._new || lineStarted(l)) && !lineComplete(l);

  const rows = S.lignes.map((l, idx) => {
    const errs = lineErrors(l);
    const bad = errs.some((e) => /négative|incorrecte|anormal/.test(e));
    const imp = (S.ref.typologies.find((t) => t.id === l.typologie_id) || {}).imputation || "";
    const started = lineNeeds(l);
    const anyH = DCOL.some((k) => { const v = l[k]; return (typeof v === "number" ? v : num(v)) !== 0; });
    const nd = (f) => (started && !l[f]) ? " need" : "";
    const ndH = (started && !anyH) ? " need" : "";
    return '<tr class="' + (bad ? "err" : "") + '" data-idx="' + idx + '">' +
      '<td class="txt col-sticky' + nd('batiment_id') + '" style="min-width:96px"><select data-f="batiment_id" ' + (editable ? "" : "disabled") + '>' + opt(S.ref.batiments, l.batiment_id, "Bât.", "code") + '</select></td>' +
      '<td class="txt' + nd('niveau_id') + '"><select data-f="niveau_id" ' + (editable ? "" : "disabled") + '>' + opt(niveauxFor(l.batiment_id), l.niveau_id, "Niv.", "code") + '</select></td>' +
      '<td class="txt' + nd('salle_id') + '"><select data-f="salle_id" ' + (editable ? "" : "disabled") + '>' + opt(sallesFor(l.batiment_id, l.niveau_id), l.salle_id, "Salle", "code") + '</select></td>' +
      '<td class="txt' + nd('typologie_id') + '" style="min-width:120px"><select data-f="typologie_id" ' + (editable ? "" : "disabled") + '>' + opt(S.ref.typologies, l.typologie_id, "Travaux", "libelle") + '</select></td>' +
      '<td class="imp">' + (imp || "—") + '</td>' +

function trendChart(data) {
  if (!data || data.length < 2) return '<div class="muted" style="font-size:13px;padding:6px 0">Il faut au moins 2 semaines de données pour afficher la courbe.</div>';
  const W = 640, H = 190, pL = 42, pR = 12, pT = 12, pB = 26;
  const maxV = Math.max(10, ...data.map((d) => d.total));
  const top = Math.ceil(maxV / 10) * 10;
  const x = (i) => pL + i * (W - pL - pR) / (data.length - 1);
  const y = (v) => pT + (1 - v / top) * (H - pT - pB);
  const line = data.map((d, i) => x(i) + "," + y(d.total)).join(" ");
  const grid = [0, 0.5, 1].map((f) => {
    const gy = pT + f * (H - pT - pB);
    return '<line x1="' + pL + '" y1="' + gy + '" x2="' + (W - pR) + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pL - 6) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + Math.round(top * (1 - f)) + '</text>';
  }).join("");
  const step = Math.ceil(data.length / 8);
  const xlab = data.map((d, i) => (i % step === 0 || i === data.length - 1)
    ? '<text x="' + x(i) + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="var(--muted)">S' + d.numero + '</text>' : "").join("");
  const dots = data.map((d, i) => '<circle cx="' + x(i) + '" cy="' + y(d.total) + '" r="' + (d.current ? 4 : 2.6) + '" fill="' + (d.current ? "var(--accent)" : "var(--panel)") + '" stroke="var(--accent)" stroke-width="1.5"><title>S' + d.numero + " " + d.annee + " — " + (fmt(d.total) || "0") + ' h</title></circle>').join("");
  const area = "M" + x(0) + "," + y(0) + " L" + data.map((d, i) => x(i) + "," + y(d.total)).join(" L") + " L" + x(data.length - 1) + "," + y(0) + " Z";
  return '<div style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;min-width:460px;height:auto;display:block">' +
    grid + '<path d="' + area + '" fill="var(--accent)" opacity="0.09"/>' +
    '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + xlab + '</svg></div>';
}

async function sendExportEmail() {
  const to = ($("#em-to").value || "").trim();
  const subject = ($("#em-subj").value || "").trim();
  const message = $("#em-body").value || "";
  const fmt = $("#em-fmt").value;
  if (!to) return alert("Renseigne au moins un destinataire.");
  S.busy = true; render();
  try {
    const rows = await fetchDetail();
    if (!rows.length) { S.busy = false; render(); return alert("Aucune donnée à exporter pour cette semaine."); }
    let contentBase64, filename, mime;
    if (fmt === "csv") {
      const head = Object.keys(rows[0]);
      const csv = [head.join(";")].concat(rows.map((r) => head.map((h) => '"' + String(r[h]).replace(/"/g, "'") + '"').join(";"))).join("\r\n");
      contentBase64 = btoa(unescape(encodeURIComponent("﻿" + csv)));
      filename = "Pointage_S" + S.semaine.numero + "_" + S.semaine.annee + ".csv";
      mime = "text/csv";
    } else {
      const wb = buildWorkbook(rows);
      contentBase64 = XLSX.write(wb, { type: "base64", bookType: "xlsx" });
      filename = "Pointage_S" + S.semaine.numero + "_" + S.semaine.annee + ".xlsx";
      mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    }
    const { data, error } = await sb.functions.invoke("envoi-export", {
      body: { to, subject, message, filename, contentBase64, mime, semaine_id: S.semaine.id },
    });
    if (error) throw new Error((data && data.error) || error.message);
    if (data && data.error) throw new Error(data.error);
    S.busy = false;
    S.modal = modal("E-mail envoyé", '<div class="alert ok"><span>✓</span> Export envoyé à : <b>' + esc((data.envoye_a || []).join(", ")) + '</b>.</div>', '<button class="btn primary" onclick="closeModal();goto(\'export\')">OK</button>');
    render();
  } catch (e) {
    S.busy = false; render();
    alert("Envoi impossible : " + errMsg(e) + "\n\nLes fonctions e-mail ont-elles été déployées dans Supabase ?");
  }
}
function buildWorkbook(rows) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Détail");
  const byC = {}; rows.forEach((r) => byC[r.Collaborateur] = (byC[r.Collaborateur] || 0) + r.Heures);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(byC).map(([k, v]) => ({ Collaborateur: k, "Total heures": v }))), "Synthèse collaborateurs");
  const agg = (key) => { const m = {}; rows.forEach((r) => m[r[key]] = (m[r[key]] || 0) + r.Heures); return Object.entries(m).map(([k, v]) => ({ [key]: k, "Total heures": v })); };
  const synth = [{ A: "Par bâtiment" }].concat(agg("Bâtiment"), [{}], [{ A: "Par niveau" }], agg("Niveau"), [{}], [{ A: "Par travaux" }], agg("Travaux"), [{}], [{ A: "Par imputation" }], agg("Imputation"));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(synth, { skipHeader: true }), "Synthèse chantier");
  return wb;
}

/* --- calcul semaine ISO à partir d'une date --- */
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - day + 3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const fd = (firstThu.getUTCDay() + 6) % 7; firstThu.setUTCDate(firstThu.getUTCDate() - fd + 3);
  return { annee: t.getUTCFullYear(), numero: 1 + Math.round((t - firstThu) / (7 * 864e5)) };
}
function ymd(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
async function insertSemaine(monday) {
  const iso = isoWeek(monday); const fri = new Date(monday); fri.setDate(fri.getDate() + 4);
  return sb.from("semaines").insert({ annee: iso.annee, numero: iso.numero, date_debut: ymd(monday), date_fin: ymd(fri) });
}
window.addSemaine = async () => {
  const v = $("#sm-d").value; if (!v) return alert("Choisis une date.");
  const mon = mondayOf(new Date(v + "T00:00:00"));
  const { error } = await insertSemaine(mon);
  if (error) return alert(/duplicate|unique/i.test(errMsg(error)) ? "Cette semaine existe déjà." : errMsg(error));

window.addSemainesRestantes = async () => {
  const now = new Date(); let mon = mondayOf(now); const end = new Date(now.getFullYear(), 11, 31);
  const existing = new Set(S.semaines.map((s) => s.annee + "-" + s.numero));
  let n = 0;
  while (mon <= end) {
    const iso = isoWeek(mon);
    if (!existing.has(iso.annee + "-" + iso.numero)) { await insertSemaine(new Date(mon)); n++; }
    mon = new Date(mon); mon.setDate(mon.getDate() + 7);
  }
  toast(n + " semaine(s) ajoutée(s)."); refReload();
};
window.addSemainesAnnee = async () => {
  const annee = new Date().getFullYear() + 1;
  const existing = new Set(S.semaines.map((s) => s.annee + "-" + s.numero));
  let mon = mondayOf(new Date(annee, 0, 4));   // lundi de la semaine ISO 1 de l'année cible
  let n = 0;
  for (let i = 0; i < 54; i++) {
    const iso = isoWeek(mon);
    if (iso.annee === annee && !existing.has(iso.annee + "-" + iso.numero)) { await insertSemaine(new Date(mon)); n++; }
    mon = new Date(mon); mon.setDate(mon.getDate() + 7);
    if (isoWeek(mon).annee > annee) break;
  }
  toast(n ? (n + " semaine(s) ajoutée(s) pour " + annee + ".") : ("Les semaines de " + annee + " existent déjà."));
  refReload();
};
/* Génération de l'année suivante à rappeler ~6 semaines avant la fin de l'année */
function anneeSuivanteAGenerer() {
  const now = new Date();
  const finAnnee = new Date(now.getFullYear(), 11, 31);
  if ((finAnnee - now) / 864e5 > 45) return null;
  const suiv = now.getFullYear() + 1;
  return S.semaines.some((s) => s.annee === suiv) ? null : suiv;
}

  const c = S.capacite;
  if (!c) return '<p class="muted">Chargement…</p>';
  if (c._err) return '<div class="alert warn"><span>⚠</span><div>L\'audit de capacité n\'est pas disponible. Exécute le script <b>03_capacite_et_sauvegardes.sql</b> dans Supabase.<br><span style="font-size:12px">(' + esc(c._err) + ')</span></div></div>';

  const pctDb = Math.min(100, mo(c.db_bytes) / mo(c.limite_db_bytes) * 100);
  const barColor = pctDb < 60 ? "var(--green)" : pctDb < 85 ? "var(--orange)" : "var(--red)";

  // projection à partir du journal
  let proj = "";
  const h = S.capaciteHist || [];
  if (h.length >= 2) {
    const a = h[0], b = h[h.length - 1];
    const days = (new Date(b.created_at) - new Date(a.created_at)) / 864e5;
    const growth = b.db_bytes - a.db_bytes;
    if (days >= 10 && growth > 0) {
      const perDay = growth / days;
      const remain = (c.limite_db_bytes - c.db_bytes) / perDay;
      const dt = new Date(Date.now() + remain * 864e5);
      const perMonth = perDay * 30;
      proj = "Croissance mesurée : ~<b>" + moTxt(perMonth) + "/mois</b>. À ce rythme, le plafond de 500 Mo serait atteint vers <b>" + ("0" + (dt.getMonth() + 1)).slice(-2) + "/" + dt.getFullYear() + "</b>" + (remain > 3650 ? " (soit bien au-delà de la durée du chantier)" : "") + ".";
    }
  }
  if (!proj) proj = "Relance l'audit dans ~1 mois : avec au moins deux relevés espacés, une projection de croissance s'affichera ici.";

  let verdict, vClass;
  const anneesRestantes = h.length >= 2 ? (() => { const a = h[0], b = h[h.length - 1]; const days = (new Date(b.created_at) - new Date(a.created_at)) / 864e5; const g = b.db_bytes - a.db_bytes; return (days >= 10 && g > 0) ? ((c.limite_db_bytes - c.db_bytes) / (g / days)) / 365 : 99; })() : 99;
  if (mo(c.db_bytes) > 425 || anneesRestantes < 1) { verdict = "Il faut agir : passer à Supabase Pro (sauvegarde auto + 8 Go), ou faire de la place."; vClass = "bad"; }
  else if (mo(c.db_bytes) > 300 || anneesRestantes < 2) { verdict = "À surveiller. Prévoir le passage à Supabase Pro dans les mois qui viennent."; vClass = "warn"; }
  else { verdict = "Le plan gratuit convient largement pour l'instant."; vClass = "ok"; }

  const topTables = (c.tables || []).filter((t) => t.bytes > 8192).slice(0, 8);

  return '<div class="between" style="align-items:flex-start"><h3 style="margin:0">Audit de capacité</h3>' +
    '<button class="btn primary" onclick="runAudit()">Lancer un nouvel audit</button></div>' +
    '<div style="margin-top:16px"><div class="between"><span class="lbl" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">Base de données</span>' +
      '<span><b>' + moTxt(c.db_bytes) + '</b> <span class="muted">/ 500 Mo</span></span></div>' +
      '<div style="height:12px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);margin-top:6px;overflow:hidden">' +
      '<div style="height:100%;width:' + pctDb.toFixed(1) + '%;background:' + barColor + '"></div></div></div>' +
    '<div class="kpis" style="margin-top:16px">' +
      '<div class="kpi"><div class="n">' + c.nb_comptes_actifs + '</div><div class="l">Comptes actifs / 50 000</div></div>' +
      '<div class="kpi"><div class="n">' + c.nb_feuilles + '</div><div class="l">Feuilles de pointage</div></div>' +
      '<div class="kpi"><div class="n">' + c.nb_lignes + '</div><div class="l">Lignes de pointage</div></div>' +
      '<div class="kpi"><div class="n">' + c.nb_audit + '</div><div class="l">Entrées de traçabilité</div></div></div>' +
    '<div class="alert ' + vClass + '" style="margin-top:16px"><span>' + (vClass === "ok" ? "✓" : "⚠") + '</span><div><b>' + verdict + '</b><br><span style="font-size:12.5px">' + proj + '</span></div></div>' +
    '<div class="alert ok" style="margin-top:8px"><span>ℹ</span><div>La <b>bande passante</b> (Supabase 5 Go/mois, Netlify 100 Go/mois) ne se mesure pas ici. À vérifier une fois par mois : ' +
      '<a href="' + SUPA_USAGE_URL + '" target="_blank" rel="noopener">Supabase — Usage</a> · <a href="' + NETLIFY_URL + '" target="_blank" rel="noopener">Netlify</a>. Pour ton usage (≈80 personnes, une fois par semaine), ce n\'est pas un point de risque — seule la taille de la base compte.</div></div>' +
    (topTables.length ? '<h3 style="margin-top:18px">Détail par table</h3><div class="grid-wrap"><table class="grid"><thead><tr><th>Table</th><th class="num">Lignes (est.)</th><th class="num">Taille</th></tr></thead><tbody>' +
      topTables.map((t) => '<tr><td>' + esc(t.table) + '</td><td class="num">' + t.rows + '</td><td class="num">' + moTxt(t.bytes) + '</td></tr>').join("") + '</tbody></table></div>' : "") +
    (h.length ? '<h3 style="margin-top:18px">Historique des audits</h3><div class="grid-wrap"><table class="grid"><thead><tr><th>Date</th><th class="num">Base</th><th class="num">Lignes</th><th class="num">Traçabilité</th></tr></thead><tbody>' +
      h.slice().reverse().map((r) => '<tr><td>' + frDateTime(r.created_at) + '</td><td class="num">' + moTxt(r.db_bytes) + '</td><td class="num">' + r.nb_lignes + '</td><td class="num">' + r.nb_audit + '</td></tr>').join("") + '</tbody></table></div>' : "");
}

/* ---------- modal ---------- */
function modal(title, html, actions) {
  return '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>' + title + '</h2><div>' + html + '</div><div class="actions">' + actions + '</div></div></div>';
}
window.closeModal = () => { S.modal = null; render(); };

</script>
</body>
</html>
